# Supabase CLI local/function configuration.
# These functions use their own server-side authentication and are called by
# the database with a runtime secret, not with a Supabase JWT.
[functions.agent-runtime]
verify_jwt = false

[functions.bot-notify]
verify_jwt = false

[functions.enrich-task]
verify_jwt = false

# task-embed вызывается только pg_cron через net.http_post, без Supabase JWT.
# Собственной аутентификации не делает по образцу enrich-task: операция
# идемпотентна (пишет только embedding IS NULL) и не меняет права доступа.
[functions.task-embed]
verify_jwt = false

# calendar-sync walks the whole Yandex calendar over CalDAV (no server-side
# time-range filter is supported by Yandex), so it needs more headroom than the
# default. It was timing out with 503 on an 18-event calendar.
[functions.calendar-sync]
verify_jwt = false
